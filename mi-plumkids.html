<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Plumkids</title><link rel="stylesheet" href="account.css"></head><body><header class="top"><div class="wrap top-in"><a class="logo" href="index.html"><span class="plum"></span>Plumkids</a><div class="top-actions"><a class="btn btn-light hide-mobile" href="index.html#apps">Explorar apps</a><button id="logoutBtn" class="btn btn-danger">Salir</button></div></div></header><main class="wrap dashboard"><div id="loading"><div class="spinner"></div></div><div id="dashboardContent" hidden><section class="welcome"><div><span class="badge">MI PLUMKIDS</span><h1 id="welcomeName">Hola</h1><p>Administra tus apps y perfiles familiares.</p></div><a class="btn btn-primary" href="index.html#apps">Comprar otra app</a></section><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Mis apps</h2><span id="appCount" class="badge">0 apps</span></div><div id="appsContainer" class="apps-grid"></div></section><aside class="panel"><div class="panel-head"><h2>Niños/as</h2></div><div id="childrenContainer"></div><form id="childForm" class="inline-form"><strong>Agregar perfil</strong><div class="field"><label>Nombre</label><input name="name" maxlength="80" required></div><div class="field"><label>Edad</label><input name="age" type="number" min="2" max="17" required></div><button class="btn btn-outline full" type="submit">Agregar</button></form></aside></div></div></main><footer class="footer">© 2026 Plumkids · Mi Plumkids.</footer><script>
const appInfo={
  'lectoaventura':{name:'LectoAventura',image:'assets/app-lecto.png',url:'apps/lectoaventura.html'},
  'mateaventura':{name:'MateAventura',image:'assets/app-mate.png',url:'apps/mateaventura.html'},
  'memoria-magica':{name:'Memoria Mágica',image:'assets/app-memoria.png',url:'apps/memoria-magica.html'},
  'emociones-en-juego':{name:'Emociones en Juego',image:'assets/app-emociones.png',url:'apps/emociones-en-juego.html'}
};
async function api(url,opts){const r=await fetch(url,opts);if(r.status===401){location.href='login.html';throw new Error('Sesión expirada')}const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error');return d}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderApps(entitlements){
  const c=document.getElementById('appsContainer');
  c.innerHTML='';
  document.getElementById('appCount').textContent=`${entitlements.length} ${entitlements.length===1?'app':'apps'}`;
  if(!entitlements.length){
    c.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="emoji">🎮</div><h3>Aún no tienes apps activadas</h3><p>Después de una compra aprobada, la app aparecerá aquí.</p><a class="btn btn-primary" href="index.html#apps">Explorar apps</a></div>';
    return;
  }
  entitlements.forEach(e=>{
    const a=appInfo[e.app_slug]||{name:e.app_slug,image:'',url:'#'};
    const art=a.image
      ? `<div class="app-art app-art-image"><img src="${a.image}" alt="${a.name}"></div>`
      : `<div class="app-art">🎮</div>`;
    c.insertAdjacentHTML('beforeend',`<article class="app-card">${art}<div class="app-body"><h3>${a.name}</h3><p>Acceso habilitado para tu cuenta.</p><a class="btn btn-primary full" href="${a.url}#probar">Abrir app</a></div></article>`);
  });
}
function renderChildren(children){const c=document.getElementById('childrenContainer');c.innerHTML='';if(!children.length){c.innerHTML='<p class="muted">Aún no has agregado perfiles.</p>';return}children.forEach(ch=>c.insertAdjacentHTML('beforeend',`<div class="child-card"><strong>${escapeHtml(ch.name)}</strong><span>${ch.age} años</span></div>`))}
async function load(){try{const [me,ent,children]=await Promise.all([api('/api/auth/me'),api('/api/entitlements'),api('/api/children')]);document.getElementById('welcomeName').textContent=`Hola, ${me.user.first_name}`;renderApps(ent.entitlements||[]);renderChildren(children.children||[]);document.getElementById('loading').hidden=true;document.getElementById('dashboardContent').hidden=false}catch(e){console.error(e)}}
document.getElementById('logoutBtn').addEventListener('click',async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}finally{location.href='login.html'}});document.getElementById('childForm').addEventListener('submit',async(e)=>{e.preventDefault();const f=e.currentTarget;try{await api('/api/children',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name.value.trim(),age:Number(f.age.value)})});f.reset();const d=await api('/api/children');renderChildren(d.children||[])}catch(err){alert(err.message)}});load();
</script></body></html>
