<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingresar | Plumkids</title><link rel="stylesheet" href="account.css"></head><body><header class="top"><div class="wrap top-in"><a class="logo" href="index.html"><span class="plum"></span>Plumkids</a><div class="top-actions"><a class="btn btn-light hide-mobile" href="index.html">Volver al portal</a></div></div></header><main class="auth-shell"><section class="card"><span class="badge">MI PLUMKIDS</span><h1>Ingresar</h1><p class="muted">Accede a las aplicaciones que has comprado para tu familia.</p><div id="msg" class="notice"></div><form id="loginForm"><div class="field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="tu@correo.com"></div><div class="field"><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required placeholder="••••••••"></div><button id="submitBtn" class="btn btn-primary full" type="submit">Ingresar</button></form><p class="helper">¿Aún no tienes cuenta? <a href="registro.html">Crear cuenta</a></p></section></main><footer class="footer">© 2026 Plumkids · Área de familias.</footer><script>const form=document.getElementById('loginForm'),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');function show(text,type='error'){msg.textContent=text;msg.className='notice show '+type}form.addEventListener('submit',async(e)=>{e.preventDefault();btn.disabled=true;btn.textContent='Ingresando...';msg.className='notice';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value.trim().toLowerCase(),password:form.password.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No fue posible iniciar sesión.');location.href='mi-plumkids.html'}catch(err){show(err.message)}finally{btn.disabled=false;btn.textContent='Ingresar'}});</script></body></html>
