<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear cuenta | Plumkids</title><link rel="stylesheet" href="account.css"></head><body><header class="top"><div class="wrap top-in"><a class="logo" href="index.html"><span class="plum"></span>Plumkids</a><div class="top-actions"><a class="btn btn-light hide-mobile" href="index.html">Volver al portal</a></div></div></header><main class="auth-shell"><section class="card"><span class="badge">CUENTA DEL PADRE O ACUDIENTE</span><h1>Crear cuenta</h1><p class="muted">La cuenta debe ser creada y administrada por un adulto responsable.</p><div id="msg" class="notice"></div><form id="registerForm"><div class="grid-2"><div class="field"><label>Nombre</label><input name="firstName" required maxlength="60"></div><div class="field"><label>Apellido</label><input name="lastName" required maxlength="60"></div></div><div class="field"><label>Correo electrónico</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Contraseña</label><input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Mínimo 8 caracteres"></div><div class="field"><label>Nombre del niño/a (opcional)</label><input name="childName" maxlength="80" placeholder="Puedes agregarlo después"></div><div class="field"><label>Edad del niño/a (opcional)</label><input name="childAge" type="number" min="2" max="17" inputmode="numeric"></div><button id="submitBtn" class="btn btn-primary full" type="submit">Crear mi cuenta</button></form><p class="helper">Al crear la cuenta confirmas que eres un adulto responsable. ¿Ya tienes cuenta? <a href="login.html">Ingresar</a></p></section></main><footer class="footer">© 2026 Plumkids · Área de familias.</footer><script>const form=document.getElementById('registerForm'),msg=document.getElementById('msg'),btn=document.getElementById('submitBtn');function show(text,type='error'){msg.textContent=text;msg.className='notice show '+type}form.addEventListener('submit',async(e)=>{e.preventDefault();btn.disabled=true;btn.textContent='Creando cuenta...';msg.className='notice';const age=form.childAge.value?Number(form.childAge.value):null;try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName:form.firstName.value.trim(),lastName:form.lastName.value.trim(),email:form.email.value.trim().toLowerCase(),password:form.password.value,childName:form.childName.value.trim()||null,childAge:age})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No fue posible crear la cuenta.');location.href='mi-plumkids.html'}catch(err){show(err.message)}finally{btn.disabled=false;btn.textContent='Crear mi cuenta'}});</script></body></html>
